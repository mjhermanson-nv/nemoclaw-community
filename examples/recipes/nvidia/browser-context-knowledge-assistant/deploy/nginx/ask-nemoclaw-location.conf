# Optional Brev adapter. Include this file inside the existing authenticated
# Brev Nginx server block. It exposes only the Ask NemoClaw plugin API and does
# not replace the launchable dashboard or expose the complete Hermes dashboard.
location ^~ /ask-nemoclaw/ {
    proxy_pass http://127.0.0.1:18789/api/plugins/ask-nemoclaw/;
    proxy_http_version 1.1;

    # Hermes remains loopback-bound. Not forwarding the public Host preserves
    # the prepared image's single-user loopback development identity. Brev is
    # responsible for authenticating access to the public Secure Link.
    proxy_set_header Host 127.0.0.1:18789;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_buffering off;
}
