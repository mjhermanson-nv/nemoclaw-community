# Dedicated Ask NemoClaw ingress for a Brev HTTP Secure Link. Keeping this on
# a separate listener prevents the Brev control UI and Hermes dashboard from
# competing for absolute /api and WebSocket paths.
server {
    listen 0.0.0.0:__PROXY_PORT__;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:__DASHBOARD_PORT__;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Brev authenticates the public Secure Link. Hermes remains configured
        # for its single-user loopback identity and never sees the public Host.
        proxy_set_header Host 127.0.0.1:__DASHBOARD_PORT__;
        proxy_set_header Origin http://127.0.0.1:__DASHBOARD_PORT__;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 5s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
    }
}
